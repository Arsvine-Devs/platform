[project]
name = "arsvine-ops"
version = "0.1.0"
description = "Build and operate Arsvine's websites"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.3"]

[project.scripts]
web-build = "arsvine_ops.build.site_release:main"
web-new = "arsvine_ops.build.new_site:main"
web-data = "arsvine_ops.data.cli:main"
web-initialize = "arsvine_ops.data.initialize_environment:main"
webctl = "arsvine_ops.web.webctl:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = ["basedpyright", "pytest", "ruff", "types-PyYAML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
