packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 1440
permissions:
  "@ui-sdk/core":
    skills: [ui-sdk]
skills:
  dirs: [.agents/skills]
overrides:
  esbuild@0.18: 0.25.4
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  postcss: 8.5.23
